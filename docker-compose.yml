---
services:
  influxdb:
    image: docker.io/influxdb:2.7.6
    ports:
      - 8086:8086
    volumes:
      - /home/influxdb/influxdb2:/var/lib/influxdb2
    user: 1001:1001
    restart: unless-stopped

  sma:
    build: .
    volumes:
      - config.toml:/usr/src/config.toml
    restart: unless-stopped